components:
  schemas:
    DataStatus:
      type: string
      enum:
      - actual
      - actual_backed
      - open_api
      - t3q_supplied
      - derived
      - scenario
      - scenario_input
      - mock
      - synthetic_demo
      - provisional
      - not_available
    ApiMeta:
      type: object
      required:
      - request_id
      - provider
      - data_status
      - fallback_used
      properties:
        request_id:
          type: string
        provider:
          type: string
        data_status:
          $ref: '#/components/schemas/DataStatus'
        fallback_used:
          type: boolean
        generated_at:
          type: string
          format: date-time
          nullable: true
    ApiEnvelope:
      type: object
      required:
      - data
      - meta
      - warnings
      - errors
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ApiMeta'
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    CreateSituationRequest:
      type: object
      required:
      - admin_code
      - hazards
      properties:
        admin_code:
          type: string
        reference_time:
          type: string
          format: date-time
        mode:
          type: string
          enum:
          - live
          - hybrid
          - scenario
        hazards:
          type: array
          items:
            type: string
        observations:
          type: array
          items:
            type: object
        user_input:
          type: object
    ObservationQueryRequest:
      type: object
      required:
      - admin_code
      properties:
        admin_code:
          type: string
        reference_time:
          type: string
          format: date-time
    SituationReferenceRequest:
      type: object
      properties:
        situation_id:
          type: string
        situation:
          type: object
      anyOf:
      - required:
        - situation_id
      - required:
        - situation
    SimilarEventSearchRequest:
      allOf:
      - $ref: '#/components/schemas/SituationReferenceRequest'
      - type: object
        properties:
          top_k:
            type: integer
            minimum: 1
            maximum: 15
    RiskKnowledgeRequest:
      type: object
      properties:
        admin_code:
          type: string
        query:
          type: string
    AgentMessageRequest:
      type: object
      required:
      - message
      properties:
        situation_id:
          type: string
        situation:
          type: object
        message:
          type: string
          minLength: 1
          maxLength: 4000
    ReportDraftRequest:
      type: object
      properties:
        situation_id:
          type: string
        situation:
          type: object
        selected_similar_event_ids:
          type: array
          items:
            type: string
        evidence_selection:
          type: object
    SatelliteSelectionRequest:
      type: object
      properties:
        event:
          type: object
        candidates:
          type: array
          items:
            type: object
    T3qSearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        admin_code:
          type: string
          nullable: true
        taxonomy_codes:
          type: array
          items:
            type: string
        schema_types:
          type: array
          items:
            type: string
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
