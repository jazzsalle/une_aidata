<script>

const main=document.querySelector('#main');
const heads={dashboard:['지도 기반 재난 상황판','현재 조건, 위험지구, 유사사례와 대응절차를 지도 중심으로 확인합니다.'],evidence:['위성영상·침수흔적·피해복구 근거','취약지역의 시점별 변화와 과거 피해·대응·복구 Seed를 함께 비교합니다.'],report:['상황보고서 초안 작성','현재 상황, 판단근거, 조치결과를 검토 가능한 보고서 초안으로 정리합니다.']};

function dashboard(){return heading()+`<div class="dash"><section class="card panel"><div class="tabs"><button class="active">재난상황 입력</button><button>AI Agent</button></div><div class="field"><label>재난유형</label><select><option>호우 · 홍수</option></select></div><div class="field"><label>3시간 누적강우</label><input value="96 mm"></div><div class="field"><label>남원수위표</label><input value="4.62 m · 상승 중"></div><div class="field"><label>현장징후</label><textarea>요천 둔치 진입로 일부 통제 필요. 저지대 배수상태 확인 요청.</textarea></div><button class="primary">현재 조건 적용·재산정</button><div class="prompts"><strong>추천 질문</strong><button>현재 우선 확인할 위험지역은?</button><button>과거 유사한 집중호우 사례는?</button><button>매뉴얼상 지금 해야 할 조치는?</button></div></section><section class="card map" aria-label="VWorld 지도 시각화"><div class="river"></div><div class="risk r1"></div><div class="risk r2"></div><div class="marker m1"></div><div class="marker m2"></div><div class="mapbar"><div class="layer"><span>일반지도 ●</span><span>영상지도 ○</span><span>하천 ON</span><span>위험지구 ON</span><span>침수흔적 ON</span><span>관측소 ON</span></div><span class="badge">VWorld 연결</span></div><div class="mapnote"><strong>1순위 · 요천 인접 저지대</strong><br>호우경보 기준 충족 · 수위 상승 · 과거 침수이력</div></section><aside class="card panel insight"><div class="tabs"><button class="active">현재 판단</button><button>유사사례</button><button>대응절차</button><button>계획·근거</button></div><h2>우선 확인지역</h2><div class="priority"><strong>1. 요천 인접 저지대</strong><p>3시간 96mm, 수위 상승, 하천재해 위험지구와 과거 침수흔적 중첩</p><button>지도에서 보기</button></div><div class="priority"><strong>2. 남원 도심 하천구간</strong><p>계획홍수량 산정구간, 교량·둔치 이용시설 확인 필요</p><button>지도에서 보기</button></div><div class="priority"><strong>3. 산지 인접 취약지구</strong><p>누적강우 증가 시 사면·토사 위험요인 추가 확인</p><button>지도에서 보기</button></div><p class="warning">상대적 확인 우선순위이며 공식 위기단계나 피해예측 결과가 아닙니다.</p></aside></div><section class="card timeline"><h2>현재 상황 타임라인</h2><div class="events"><article class="event"><time>10:00</time><strong>호우주의보</strong><span>기상특보 API</span></article><article class="event"><time>11:20</time><strong>3시간 60mm</strong><span>주의보 기준 도달</span></article><article class="event"><time>12:10</time><strong>수위 상승</strong><span>4.18m → 4.62m</span></article><article class="event"><time>12:40</time><strong>호우경보</strong><span>3시간 90mm 초과</span></article><article class="event"><time>13:10</time><strong>재산정 완료</strong><span>우선 확인지역 3개</span></article></div></section><section class="card integration"><h2>실시간 연계 상태</h2><div class="integration-list"><div class="integration-item"><strong>VWorld 지도</strong><span class="wait">도메인 실검증 대기</span></div><div class="integration-item"><strong>기상청 초단기실황</strong><span class="wait">서비스키 실응답 대기</span></div><div class="integration-item"><strong>수위·유량</strong><span class="wait">공식 관측소 코드 대기</span></div><div class="integration-item"><strong>UNE RAG</strong><span class="wait">OpenAPI probe 대기</span></div></div></section>`}
